# Builds and tests Kumquat on Windows, producing the NSIS installer the website links to.
# Pushing a tag like v0.1.0 also attaches the installer to a draft GitHub release.
name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Fetch bundled tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-binaries.ps1

      # The Rust crate embeds dist/ at compile time, so build the pages before testing.
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Unit tests
        working-directory: apps/desktop/src-tauri
        run: cargo test --lib

      - name: Build installer
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Conversion smoke tests
        working-directory: apps/desktop/src-tauri
        continue-on-error: true
        run: cargo test --lib smoke -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: kumquat-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to a draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --draft --title "Kumquat $env:GITHUB_REF_NAME" --notes "" }
          gh release upload $env:GITHUB_REF_NAME $exe.FullName --clobber
