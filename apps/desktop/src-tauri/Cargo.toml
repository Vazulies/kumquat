[package]
name = "kumquat"
version = "0.1.2"
description = "Drag a file, tap a key, convert it."
edition = "2021"
rust-version = "1.80"
license = "MIT"

[lib]
name = "kumquat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-autostart = "2.7"
tauri-plugin-single-instance = "2.5"
tauri-plugin-drag = "2.1"
notify-rust = "4"
arboard = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
which = "8"
percent-encoding = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
lopdf = "0.38"
rqrr = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "tiff"] }
pdfium-render = { version = "0.8", default-features = false, features = ["pdfium_latest", "image_latest", "thread_safe"] }
rust_xlsxwriter = "0.90"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes"] }
gtk = "0.18"
gdkx11 = "0.18"

# Same version Tauri itself uses, so it isn't built twice.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
opt-level = "s"
strip = true

# Image work (snapshots, PDF compression) is slow unoptimized; speed up deps in dev.
[profile.dev.package."*"]
opt-level = 2
